[env]
# rustc overflows its default 8 MB stack when type-checking neptune-cash
# 0.10+ on stable. Bump to 32 MB so any cargo invocation in this workspace
# (build, check, tauri, etc.) succeeds without needing the variable in the
# shell. `force = true` overrides shell-side env so a stale lower value in
# a developer's profile can't silently break the build.
RUST_MIN_STACK = { value = "33554432", force = true }

