name: Release

# Runs when you push a git tag shaped like v1.2.3.
# Builds a signed Android APK on GitHub's runner and attaches it to a draft
# GitHub Release. This gives users a verifiable provenance chain: the binary
# they download came from a specific commit, built using this committed
# workflow, on a clean GitHub VM — no one's personal laptop involved.

on:
  push:
    tags: ['v*.*.*']

# Only one release build per tag, cancel older attempts for the same tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release:
    name: Build + sign Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # needed to create the GitHub Release
    # neptune-cash has very deep macro expansions (the RpcApi blanket impl)
    # that exceed rustc's default thread stack on GitHub runners. Bump it.
    env:
      RUST_MIN_STACK: 16777216

    steps:
      - uses: actions/checkout@v4

      # GitHub runners have only 7 GB RAM; our release profile uses
      # `codegen-units = 1` + LTO which spikes memory during linking.
      # Add swap so the build doesn't OOM.
      - name: Add swap space
        run: |
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'aarch64-linux-android,x86_64-linux-android'

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: echo "y" | sdkmanager "ndk;27.0.12077973" > /dev/null

      - name: Install npm dependencies
        run: npm ci

      - name: Decode signing keystore
        # Decode the base64-encoded keystore from repo secrets to a temp file.
        # The secret itself is never printed to logs.
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
          if [ ! -s /tmp/release.keystore ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing or empty"
            exit 1
          fi

      - name: Build Android APK (unsigned)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: npx @tauri-apps/cli android build --target aarch64 --target x86_64

      - name: Align and sign APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAG: ${{ github.ref_name }}
        run: |
          APK_DIR="src-tauri/gen/android/app/build/outputs/apk/universal/release"
          BT_DIR="$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)"
          OUT="$APK_DIR/npt-wallet-$TAG.apk"

          "$BT_DIR/zipalign" -f 4 \
            "$APK_DIR/app-universal-release-unsigned.apk" \
            "$APK_DIR/aligned.apk"

          "$BT_DIR/apksigner" sign \
            --ks /tmp/release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$OUT" \
            "$APK_DIR/aligned.apk"

          "$BT_DIR/apksigner" verify --verbose "$OUT"
          echo "SIGNED_APK=$OUT" >> $GITHUB_ENV

      - name: Compute SHA256 of the signed APK
        run: |
          sha256sum "$SIGNED_APK" > "$SIGNED_APK.sha256"
          cat "$SIGNED_APK.sha256"

      - name: Clean up keystore
        if: always()
        run: rm -f /tmp/release.keystore

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NPT Mobile Wallet ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ env.SIGNED_APK }}
            ${{ env.SIGNED_APK }}.sha256
          body: |
            Automated release from GitHub Actions. Built from commit `${{ github.sha }}`.

            ### Verifying the binary

            This APK was built on GitHub's Ubuntu runner using the committed
            workflow at `.github/workflows/release.yml`. No developer machine
            was involved. You can verify the SHA256 hash below matches the
            published `.sha256` file.

            Compare the binary's signing certificate fingerprint (from
            `apksigner verify --print-certs`) against previous releases to
            confirm the key has not changed.
