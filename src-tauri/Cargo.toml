[package]
name = "npt-mobile-wallet"
version = "0.3.2"
description = "Neptune Cash Wallet"
authors = ["you"]
edition = "2021"

[lib]
name = "npt_mobile_wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-safe-area-insets-css = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
# Bounded-concurrency request streams (`buffer_unordered`) for the sync.
futures = "0.3"
anyhow = "1"
itertools = "0.14"
num-traits = "0.2"
async-trait = "0.1"
# Already in the dependency tree (transitive); used to derive scan keys in
# parallel. Declaring it directly so the scan can call into rayon.
rayon = "1"

# Neptune-core types for key derivation and transaction building.
# 0.20.x is the current neptune-core release line: it knows softfork epsilon
# (main net block 62,500), proves with Triton VM 9 and no longer links the
# legacy Triton VM 7 prover. The wallet-facing API is unchanged from 0.17.1
# apart from the removed legacy prover.
neptune-primitives = "0.20.1"
neptune-consensus = "0.20.1"
neptune-wallet = "0.20.1"
neptune-mutator-set = "0.20.1"
neptune-rpc-api = "0.20.1"
# Only for `Txid` (the transaction id shown to the user / kept for pending
# transactions). Depends on nothing beyond the crates above.
neptune-mempool = "0.20.1"

# Seed management
bip39 = { version = "2.1", features = ["zeroize"] }
aes-gcm = { version = "0.10", features = ["zeroize"] }
rand = "0.8"
sha2 = "0.10"
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
# Compact on-disk encoding of the public block-scan cache.
bincode = "1"

# CLOCK_BOOTTIME for the auto-lock timer (keeps counting while the device
# sleeps, unlike `Instant`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Mobile-only: native camera QR/barcode scanning (used on the Send screen to
# fill a recipient address). Not available on desktop — the scan command is
# simply not registered there, and the UI falls back gracefully.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

# Android-only: JNI calls on the UI thread for screenshot protection
# (FLAG_SECURE) on seed screens and for reading the clipboard ("Paste").
# Same version as wry's, so the JNIEnv/JObject types match.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# triton-vm's build script (build.rs) does heavy recursive codegen
# (Constraints::all → degree lowering → syn/prettyplease over huge expression
# trees) and overflows the Windows main-thread stack (1 MB) when built at
# opt-level 0 — e.g. `tauri android` / `cargo build` dies with
# STATUS_STACK_OVERFLOW (0xc00000fd). When cross-compiling (--target), Cargo
# does NOT forward rustflags/link-args to host build scripts, so a linker
# /STACK bump can't reach it — but `build-override` (which governs build
# scripts + proc-macros) DOES apply. Optimizing them shrinks stack frames
# enough to fit, on both native and cross builds.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

# Optimize triton-vm aggressively in all profiles to prevent stack overflows
[profile.dev.package.triton-vm]
opt-level = 3
debug = false
incremental = false
debug-assertions = false
overflow-checks = false

[profile.dev.package.twenty-first]
opt-level = 1

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.triton-vm]
opt-level = 3
debug = false
incremental = false
debug-assertions = false
overflow-checks = false
