[package]
name = "npt-mobile-wallet"
version = "0.1.0"
description = "Neptune Mobile Wallet"
authors = ["you"]
edition = "2021"

[lib]
name = "npt_mobile_wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-safe-area-insets-css = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
itertools = "0.14"
num-traits = "0.2"

# Neptune-core types for local key derivation and transaction building.
# This is the critical dependency — gives us SecretKeyMaterial, WalletEntropy,
# GenerationSpendingKey, ReceivingAddress, etc.
# Neptune-core v0.8.0 — official release with public wallet APIs
# (TransactionDetails::new_without_coinbase, PrimitiveWitness::from_transaction_details, etc.)
neptune-cash = { git = "https://github.com/Neptune-Crypto/neptune-core.git", tag = "v0.8.0" }

# Seed management
bip39 = "2.1"
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
bincode = "1"

# Override leveldb-sys with a stub — we don't use LevelDB in the mobile wallet,
# but neptune-cash pulls it in transitively. The stub avoids CMake cross-compile issues.
[patch.crates-io]
leveldb-sys = { path = "../leveldb-sys" }
systemstat = { path = "../systemstat-stub" }

# Optimize triton-vm aggressively in all profiles to prevent stack overflows
[profile.dev.package.triton-vm]
opt-level = 3
debug = false
incremental = false
debug-assertions = false
overflow-checks = false

[profile.dev.package.twenty-first]
opt-level = 1

[profile.release]
lto = true
opt-level = 3
codegen-units = 1

[profile.release.package.triton-vm]
opt-level = 3
debug = false
incremental = false
debug-assertions = false
overflow-checks = false
