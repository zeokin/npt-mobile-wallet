[package]
name = "npt-mobile-wallet"
version = "0.2.1"
description = "Neptune Cash Wallet"
authors = ["you"]
edition = "2021"

[lib]
name = "npt_mobile_wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-safe-area-insets-css = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
itertools = "0.14"
num-traits = "0.2"
async-trait = "0.1"
# Already in the dependency tree (transitive); used to derive scan keys in
# parallel. Declaring it directly so the scan can call into rayon.
rayon = "1"

# Neptune-core types for local key derivation and transaction building.
# This is the critical dependency — gives us SecretKeyMaterial, WalletEntropy,
# GenerationSpendingKey, ReceivingAddress, etc.
# Neptune-core v0.12.0 — hardfork-gamma (consensus); tasm-lib/triton-vm
# 3.0.0 -> 7.0.0; "Use entire payload when generating encryption seed and
# nonce" (EC-hybrid/viewing). Every public API this wallet touches is
# byte-identical to 0.11.0, so this is a pure dependency bump.
# (v0.11.0 added the viewing-address and EC-hybrid address formats used for QR
# receive; v0.10.0 added lustration support: hardfork-beta at block 38,000.)
neptune-cash = "0.12.0"

# Seed management
bip39 = "2.1"
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
bincode = "1"

# Mobile-only: native camera QR/barcode scanning (used on the Send screen to
# fill a recipient address). Not available on desktop — the scan command is
# simply not registered there, and the UI falls back gracefully.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

# Override leveldb-sys with a stub — we don't use LevelDB in the mobile wallet,
# but neptune-cash pulls it in transitively. The stub avoids CMake cross-compile issues.
[patch.crates-io]
leveldb-sys = { path = "../leveldb-sys" }
systemstat = { path = "../systemstat-stub" }

# triton-vm's build script (build.rs) does heavy recursive codegen
# (Constraints::all → degree lowering → syn/prettyplease over huge expression
# trees) and overflows the Windows main-thread stack (1 MB) when built at
# opt-level 0 — e.g. `tauri android` / `cargo build` dies with
# STATUS_STACK_OVERFLOW (0xc00000fd). When cross-compiling (--target), Cargo
# does NOT forward rustflags/link-args to host build scripts, so a linker
# /STACK bump can't reach it — but `build-override` (which governs build
# scripts + proc-macros) DOES apply. Optimizing them shrinks stack frames
# enough to fit, on both native and cross builds.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

# Optimize triton-vm aggressively in all profiles to prevent stack overflows
[profile.dev.package.triton-vm]
opt-level = 3
debug = false
incremental = false
debug-assertions = false
overflow-checks = false

[profile.dev.package.twenty-first]
opt-level = 1

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.triton-vm]
opt-level = 3
debug = false
incremental = false
debug-assertions = false
overflow-checks = false
